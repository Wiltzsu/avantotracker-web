name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        package-manager-cache: false

    - name: Verify required secrets
      run: |
        test -n "${{ secrets.REACT_APP_API_URL }}" || { echo "REACT_APP_API_URL secret is missing"; exit 1; }
        test -n "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY secret is missing"; exit 1; }
        test -n "${{ secrets.HOST }}" || { echo "HOST secret is missing"; exit 1; }
        test -n "${{ secrets.USER }}" || { echo "USER secret is missing"; exit 1; }

    - name: Install dependencies
      run: npm ci

    - name: Build with Vite
      env:
        VITE_API_URL: ${{ secrets.REACT_APP_API_URL }}
      run: npm run build

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}

    - name: Deploy to server
      env:
        DEPLOY_HOST: ${{ secrets.HOST }}
        DEPLOY_USER: ${{ secrets.USER }}
      run: |
        set -euo pipefail

        mkdir -p ~/.ssh
        ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

        REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
        REMOTE_DIR="/var/www/avantotracker-web/build"
        STAGING_DIR="/tmp/avantotracker-deploy"

        ssh -o StrictHostKeyChecking=no "$REMOTE" "rm -rf ${STAGING_DIR} && mkdir -p ${STAGING_DIR}"
        scp -o StrictHostKeyChecking=no -r build/* "${REMOTE}:${STAGING_DIR}/"
        ssh -o StrictHostKeyChecking=no "$REMOTE" "\
          sudo mkdir -p ${REMOTE_DIR} && \
          sudo rsync -a --delete ${STAGING_DIR}/ ${REMOTE_DIR}/ && \
          sudo chown -R www-data:www-data ${REMOTE_DIR} && \
          rm -rf ${STAGING_DIR}"
        ssh -o StrictHostKeyChecking=no "$REMOTE" "sudo systemctl restart nginx"
