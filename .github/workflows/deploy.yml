name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        package-manager-cache: false

    - name: Verify required secrets
      run: |
        test -n "${{ secrets.REACT_APP_API_URL }}" || { echo "REACT_APP_API_URL secret is missing"; exit 1; }
        test -n "${{ secrets.SSH_KEY }}" || { echo "SSH_KEY secret is missing"; exit 1; }
        test -n "${{ secrets.HOST }}" || { echo "HOST secret is missing"; exit 1; }
        test -n "${{ secrets.USER }}" || { echo "USER secret is missing"; exit 1; }

    - name: Install dependencies
      run: npm ci

    - name: Build with Vite
      env:
        VITE_API_URL: ${{ secrets.REACT_APP_API_URL }}
      run: npm run build

    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}
        HOST: ${{ secrets.HOST }}
        USER: ${{ secrets.USER }}
      run: |
        set -euo pipefail

        if [[ -z "${SSH_KEY//[[:space:]]/}" ]]; then
          echo "Error: SSH_KEY secret is empty."
          exit 1
        fi

        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
          echo "Error: SSH_KEY is not a valid unencrypted private key."
          exit 1
        fi

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

        REMOTE="${USER}@${HOST}"
        REMOTE_DIR="/var/www/avantotracker-web/build"
        SSH_OPTS=(-i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30)

        echo "Testing SSH connection to ${REMOTE}..."
        ssh "${SSH_OPTS[@]}" "$REMOTE" "echo 'SSH OK'"

        echo "Preparing deploy directory permissions..."
        ssh "${SSH_OPTS[@]}" "$REMOTE" bash -s <<EOF
          set -euo pipefail
          mkdir -p '${REMOTE_DIR}'
          sudo -n chown -R "\$(whoami):www-data" /var/www/avantotracker-web
          sudo -n chmod -R g+w /var/www/avantotracker-web
          rm -rf '${REMOTE_DIR:?}'/*
        EOF

        echo "Uploading build files..."
        scp "${SSH_OPTS[@]}" -r build/* "${REMOTE}:${REMOTE_DIR}/"
